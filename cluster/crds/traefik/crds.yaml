# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux-schema/refs/heads/main/catalog/latest/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-crds
  namespace: networking
spec:
  interval: 30m
  chart:
    spec:
      # renovate: registryUrl=https://helm.traefik.io/traefik chart=traefik-crds
      chart: traefik-crds
      version: 1.18.0
      sourceRef:
        kind: HelmRepository
        name: traefik-charts
        namespace: flux-system
  install:
    serverSideApply: true
  upgrade:
    serverSideApply: "enabled"
  values:
    traefik: true
    hub: true
