---
apiVersion: v1
kind: ConfigMap
metadata:
  name: emqx-gatus-ep
  namespace: home
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: mqtt-broker-internal
        url: "tcp://emqx-headless.svc.home.cluster.internal:1883"
        interval: 300s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
        ui:
          hide-hostname: true
          badge:
            response-time:
              thresholds: [40, 100, 500, 900, 3100]
      - name: mqtt-broker-external
        url: "tcp://mqtt.${XYZ_DOMAIN}:8883"
        interval: 300s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
        ui:
          hide-hostname: true
          badge:
            response-time:
              thresholds: [40, 100, 500, 900, 3100]
