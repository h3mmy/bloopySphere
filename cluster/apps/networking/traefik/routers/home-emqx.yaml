---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: emqx-wss
  namespace: home
spec:
  entryPoints:
    - wss
  routes:
    - match: HostSNI(`emqx-ws.${XYZ_DOMAIN}`)
      services:
        - name: emqx
          port: 8083
      middlewares:
        - name: networking-rfc1918-tcp@kubernetescrd
  tls:
    secretName: tls.${XYZ_DOMAIN/./-}
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: emqx-mqtt
  namespace: home
spec:
  parentRefs:
    - name: traefik
      namespace: networking
      sectionName: mqtts
  rules:
    - backendRefs:
        - name: emqx
          port: 1883
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: MiddlewareTCP
            name: rfc1918-tcp
