---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: emqx-dashboard
  namespace: home
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`emqx.${XYZ_DOMAIN}`)
      kind: Rule
      services:
        - name: emqx
          kind: Service
          port: 18083
      middlewares:
        - name: networking-bloopnet-xyz-auth@kubernetescrd
  tls:
    secretName: tls.${XYZ_DOMAIN/./-}
