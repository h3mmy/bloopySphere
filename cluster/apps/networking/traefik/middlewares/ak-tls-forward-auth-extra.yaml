---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ak-tls-forward-auth-extra
  namespace: networking
spec:
  forwardAuth:
    address: https://ak-outpost-authentik-embedded-outpost.auth.svc.cluster.local:9443/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    tls:
      # TODO: temporarily disable this for the https outpost until we figure out which strategy to use for final solution 
      insecureSkipVerify: true
    authResponseHeaders:
      - Authorization
      - Set-Cookie
      - Cookie
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
