---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik
  namespace: networking
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      hostname: '*.${XYZ_DOMAIN}'
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: tls.${XYZ_DOMAIN/./-}
            kind: Secret
            group: core
    - name: mqtts
      protocol: TLS
      port: 8883
      tls:
        mode: Terminate
        certificateRefs:
          - group: core
            kind: Secret
            name: tls.${XYZ_DOMAIN/./-} # Your exact secret name
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
