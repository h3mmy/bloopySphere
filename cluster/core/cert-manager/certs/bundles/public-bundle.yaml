---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: public-bundle
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: "bloopy-0-trust-roots"
        key: "ca.crt"
  target:
    configMap:
      metadata:
        annotations:      
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "media,home,networking,kube-system"
  
      key: "ca-certificates.crt"
