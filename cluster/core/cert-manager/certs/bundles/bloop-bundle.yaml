---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: bloop-bundle
spec:
  sources:
    - secret:
        name: "bloopy-0-trust-roots"
        key: "ca.crt"
  target:
    configMap:
      key: "ca-certificates.crt"
    namespaceSelector:
      matchExpressions:
        - key: "kubernetes.io/metadata.name"
          operator: "In"
          values:
            - "media"
            - "networking"
            - "cert-manager"
            - "auth"
            - "default"
            - "home"
            - "kube-system"
      
