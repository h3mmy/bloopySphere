---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: default-ssi
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bloopy-trust-anchor
  namespace: cert-manager
spec:
  isCA: true
  commonName: root.bloop.cluster.local
  secretName: bloopy-0-trust-roots
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: default-ssi
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bloopy-trust-issuer
  namespace: cert-manager
spec:
  ca:
    secretName: bloopy-0-trust-roots
