---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bloopy-internal-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bloopy-internal-ss-ca
  namespace: cert-manager
spec:
  commonName: bloopy-internal-ss-ca
  secretName: bloopy-internal-ss-ca
  duration: 2160h
  isCA: true
  issuerRef:
    name: bloopy-internal-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bloopy-internal-ss-ca
spec:
  ca:
    secretName: bloopy-internal-ss-ca
